name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # The weekly bump workflow dispatches CI on its pull request branch, because
  # GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN opens
  # until a maintainer approves them.
  workflow_dispatch:

# The weekly bump pull request's CI runs by dispatch on code no one has reviewed
# yet (bump-framers-deps.yml), so the token is read-only.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ] || node -e "try{const s=Object.values(require('./package.json').scripts||{}).join(' '); process.exit(s.includes('pnpm')?0:1)}catch(e){process.exit(1)}"; then
            echo "pm=pnpm" >> $GITHUB_OUTPUT
          else
            echo "pm=npm" >> $GITHUB_OUTPUT
          fi
      - name: Setup pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          # Node 22, as agentos and the monorepo's workbench workflow use. Node 20 reached its
          # end of life on 2026-04-30.
          node-version: '22'
          # setup-node@v5 defaults package-manager-cache to true, which reads the
          # "packageManager": "pnpm@..." field and runs `pnpm store path` for cache
          # setup. There is no committed lockfile to cache against and pnpm is set up
          # by the step above, so disable the built-in cache to avoid the
          # "Unable to locate executable file: pnpm" failure.
          package-manager-cache: false
      - name: Install
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            pnpm install --no-frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: npm lockfiles match their manifests
        run: |
          # `npm ci` refuses to install when a package-lock.json disagrees with
          # its package.json. Running it for every tracked npm lockfile catches
          # a manifest change that left its lockfile behind.
          git ls-files -- 'package-lock.json' '*/package-lock.json' | while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::npm ci in ${dir}"
            (cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund)
            echo "::endgroup::"
          done
      - name: Lint
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            pnpm run -r --if-present lint || pnpm run --if-present lint
          else
            npm run lint --if-present
          fi
      # The two packages run their tests in separate steps, and a failure in either fails the
      # job. backend/ installed its dependencies with `npm ci` in the lockfile step above.
      - name: Test (front end)
        run: |
          if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
            pnpm run --if-present test
          else
            npm test --if-present
          fi
      - name: Test (backend)
        working-directory: backend
        run: npm test
      - name: Coverage (Vitest, 60% lines minimum)
        run: |
          if [ -f vitest.config.ts ] || [ -f vitest.config.js ]; then
            if [ "${{ steps.pm.outputs.pm }}" = "pnpm" ]; then
              pnpm exec vitest run --coverage
            else
              npx vitest run --coverage
            fi
          else
            echo "No vitest config found; skipping coverage check."
          fi

