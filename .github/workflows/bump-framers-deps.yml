name: Bump @framers/* deps

# Weekly cron + manual trigger. Bumps every @framers/* explicit version pin
# in package.json files to the latest npm-published version, refreshes the
# pnpm lockfile and every tracked npm lockfile when present, bumps git
# submodule pointers when present,
# and opens a single Pull Request with the diff. The same workflow drops
# into every repo that depends on the agentos family.
#
# GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN opens
# or pushes to until someone with write access approves them, and a
# workflow_dispatch event always creates a run. So the ci job below starts CI
# on the pull request branch by dispatch, and its checks show on the pull
# request: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow

on:
  schedule:
    - cron: '0 6 * * 1'  # Monday 06:00 UTC weekly
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    # Read by the ci job below.
    outputs:
      operation: ${{ steps.cpr.outputs.pull-request-operation }}
      branch: ${{ steps.cpr.outputs.pull-request-branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up pnpm
        # No `version:` input: pnpm/action-setup@v6 reads the pnpm version from the
        # "packageManager" field in package.json. Passing both raises
        # ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          # No committed lockfile to cache against; the default
          # package-manager cache resolution fails the step outright
          # (same fix ci.yml carries).
          package-manager-cache: false

      - name: Update submodules to latest (when present)
        run: |
          if [ -f .gitmodules ]; then
            git submodule update --remote --recursive
          fi

      - name: Bump @framers/* deps to latest published versions
        run: python3 .github/scripts/bump-framers-deps.py

      - name: Refresh pnpm lockfile (when present)
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --no-frozen-lockfile
          fi

      - name: Refresh npm lockfiles (when present)
        run: |
          # `npm ci` refuses to install when a package-lock.json disagrees with
          # its package.json, so each tracked npm lockfile is re-resolved after
          # the bump and the two move together. --package-lock-only installs
          # nothing and --ignore-scripts runs no package script.
          git ls-files -- 'package-lock.json' '*/package-lock.json' | while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::npm lockfile in ${dir}"
            (cd "$dir" && npm install --package-lock-only --no-audit --no-fund --ignore-scripts)
            echo "::endgroup::"
          done

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): bump @framers/* deps to latest published versions'
          title: 'chore(deps): bump @framers/* deps to latest published versions'
          body: |
            Automated weekly bump of all `@framers/*` dependencies to their
            latest npm-published versions.

            Includes (when applicable):
            - `package.json` explicit-pin updates (caret semver of latest)
            - `pnpm-lock.yaml` refresh
            - `package-lock.json` refresh (every tracked npm lockfile)
            - Git submodule pointer updates (where the parent repo has submodules)

            Workspace `workspace:*` pins are not touched. Review the diff
            for any unexpected major-version jumps before merging.
          branch: chore/bump-framers-deps
          base: master
          delete-branch: true
          # No add-paths: a pathspec naming a file this repo doesn't commit
          # (pnpm-lock.yaml, .gitmodules) makes the action's `git add` fatal,
          # staging NOTHING — and `**/package.json` misses the root manifest
          # anyway. Default collection stages every bump change, including
          # submodule pointers where a repo has them (as the PR body states).

  # Runs when this run opened the pull request or pushed to its branch; a run
  # that leaves the branch as it was keeps the checks of the last dispatch. To
  # run CI on the branch again: gh workflow run ci.yml --ref chore/bump-framers-deps
  ci:
    needs: bump
    if: needs.bump.outputs.operation == 'created' || needs.bump.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    # Only this job can dispatch workflows; the bump job, which installs packages, cannot.
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the pull request branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.bump.outputs.branch }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
